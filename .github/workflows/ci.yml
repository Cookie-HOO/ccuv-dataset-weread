name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - run: go run ./cmd/manifest --os darwin --arch arm64 --out dist/generated-manifest.json
      - run: cmp manifest.json dist/generated-manifest.json
      - run: go test ./...
      - run: go vet ./...
      - run: ./scripts/package.sh darwin arm64 dist/first.tar.gz
      - run: ./scripts/package.sh darwin arm64 dist/second.tar.gz
      - run: cmp dist/first.tar.gz dist/second.tar.gz
      - run: go run ./cmd/archiveverify dist/first.tar.gz
